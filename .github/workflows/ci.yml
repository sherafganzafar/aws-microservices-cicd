name: Microservices CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask==3.1.3 pytest requests

      - name: Build Docker images
        run: |
          docker build -t user-service:v1 ./services/user-service
          docker build -t product-service:v1 ./services/product-service

      - name: Start containers
        run: |
          docker run -d --name user-container -p 127.0.0.1:5001:5001 user-service:v1
          docker run -d --name product-container -p 127.0.0.1:5002:5002 product-service:v1

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/health &&
               curl -fsS http://127.0.0.1:5002/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs user-container
          docker logs product-container
          exit 1

      - name: Run automated tests
        env:
          USER_URL: http://127.0.0.1:5001
          PRODUCT_URL: http://127.0.0.1:5002
        run: python -m pytest tests/test_apis.py -v

      - name: Stop containers
        if: always()
        run: |
          docker rm -f user-container product-container || true
